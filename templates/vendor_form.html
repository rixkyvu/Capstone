{% extends 'base.html' %}{% block title %}{{ 'Edit Vendor' if vendor else 'Add Vendor' }} | Bison Operations{% endblock %}{% block content %}<h1>{{ 'Edit Vendor' if vendor else 'Add Vendor' }}</h1><form class="form-card" method="post"><label class="field">Company Name<input name="name" value="{{ vendor.name if vendor else '' }}" required></label><label class="field">Primary Contact Name<input name="contact_name" value="{{ vendor.contact_name if vendor else '' }}" required></label><label class="field">Phone<input name="phone" value="{{ vendor.phone if vendor else '' }}"></label><label class="field">Email<input type="email" name="email" value="{{ vendor.email if vendor else '' }}"></label><label class="field">Category<select name="category">{% for c in ['Dairy','Beverages','Dry Goods','Cleaning','Frozen'] %}<option {{ 'selected' if vendor and vendor.category==c }}>{{ c }}</option>{% endfor %}</select></label><label class="field">Notes<textarea name="notes">{{ vendor.notes if vendor else '' }}</textarea></label><button class="button green">Save Vendor</button></form>{% endblock %}
